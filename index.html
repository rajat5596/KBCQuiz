/* -------------------- QUIZ LOGIC -------------------- */
const timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score');
const qcountEl = document.getElementById('qcount');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');

const sndTick = document.getElementById('timerSound');
const sndRight = document.getElementById('correctSound');
const sndWrong = document.getElementById('wrongSound');

let shuffled = [];
let gameStartIndex = 0;    // हर नए गेम पर अगले 10 लेने को
let gameSet = [];          // इस गेम के 10 प्रश्न
let qi = 0;                // index inside gameSet
let score = 0;
let timer = null;
let timeLeft = 10;

function shuffle(arr){
  for(let i=arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
function prepareShuffled(){
  shuffled = [...QUESTIONS];
  shuffle(shuffled);
  gameStartIndex = 0;
}

function startNewGame(){
  if(shuffled.length === 0) prepareShuffled();
  // अगर बाकी <10 बचे हैं तो फिर से पूरी लिस्ट reshuffle
  if(gameStartIndex + 10 > shuffled.length){
    prepareShuffled();
  }
  gameSet = shuffled.slice(gameStartIndex, gameStartIndex+10);
  gameStartIndex += 10;
  qi = 0;
  score = 0;
  updateMeta();
  loadCurrent();
}

function updateMeta(){
  scoreEl.textContent = `Score: ${score}`;
  qcountEl.textContent = `Q: ${Math.min(qi+1,10)}/10`;
}

function loadCurrent(){
  if(qi >= gameSet.length){
    finishGame();
    return;
  }
  const curr = gameSet[qi];
  questionEl.textContent = curr.q;
  optionsEl.innerHTML = '';
  curr.options.forEach((opt, idx)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.textContent = opt;
    div.onclick = ()=>checkAnswer(idx, div);
    optionsEl.appendChild(div);
  });
  startTimer();
  updateMeta();
}

function startTimer(){
  clearInterval(timer);
  timeLeft = 10;
  timerEl.textContent = `⏳ Time: ${timeLeft}`;
  // हर सेकंड टिक साउंड (हल्का)
  timer = setInterval(()=>{
    timeLeft--;
    timerEl.textContent = `⏳ Time: ${timeLeft}`;
    // कोशिश करें कि मोबाइल पर भी ऑडियो यूज़र इंटरैक्शन के बाद चले
    try { sndTick.currentTime = 0; sndTick.play(); } catch(e){}
    if(timeLeft <= 0){
      clearInterval(timer);
      lockOptions();
      // गलत माना जाएगा
      try { sndWrong.currentTime = 0; sndWrong.play(); } catch(e){}
      setTimeout(()=>{ qi++; loadCurrent(); }, 700);
    }
  }, 1000);
}

function lockOptions(){
  Array.from(document.querySelectorAll('.opt')).forEach(el=> el.onclick = null);
}

function checkAnswer(selIdx, el){
  clearInterval(timer);
  const rightIdx = gameSet[qi].answer;
  lockOptions();
  if(selIdx === rightIdx){
    el.classList.add('correct');
    score++;
    try { sndRight.currentTime = 0; sndRight.play(); } catch(e){}
  }else{
    el.classList.add('wrong');
    // सही वाले को हाइलाइट
    const nodes = Array.from(document.querySelectorAll('.opt'));
    if(nodes[rightIdx]) nodes[rightIdx].classList.add('correct');
    try { sndWrong.currentTime = 0; sndWrong.play(); } catch(e){}
  }
  updateMeta();
  setTimeout(()=>{ qi++; loadCurrent(); }, 900);
}

function finishGame(){
  optionsEl.innerHTML = '';
  questionEl.innerHTML = `
    <h2>🎉 Quiz समाप्त</h2>
    <p>आपका स्कोर: <b>${score}/10</b></p>
    <button onclick="shareScore()">📤 स्कोर शेयर करें</button>
    <button onclick="startNewGame()">🔁 Play Again (Next 10)</button>
  `;
}

function shareScore(){
  const txt = `🎯 मेरा GK Quiz स्कोर: ${score}/10\n👉 आप भी खेलें: ${location.href}`;
  if(navigator.share){
    navigator.share({title:"GK Quiz", text:txt});
  }else{
    // फॉलबैक
    prompt("ये टेक्स्ट कॉपी करें और शेयर करें:", txt);
  }
}

prepareShuffled();
startNewGame();
</script>
